# Packaging the desktop app.
#
# `directories.buildResources` is moved off its default, which is literally
# `build/` — the directory `adapter-static` writes the app into. Left alone,
# electron-builder would treat the bundle as its own icon-and-installer
# scratch space. The directory it points at need not exist, and does not: it is
# where an `icon.png` would go when there is an app icon to put there. Until
# then the builds carry Electron's own.
appId: za.co.developerhut.budgy
productName: Budgy
copyright: Budgy

directories:
  buildResources: electron/resources
  output: dist-desktop

# `files` is the whole app: the shell in `electron/`, the bundle in `build/`, and
# the manifest that names the entry point.
#
# `node_modules` is deliberately not listed. electron-builder includes production
# dependencies on its own — which is exactly what is wanted here, because
# `electron-updater` is imported by `electron/updater.js` at run time and has to
# be in the package. It is the only entry in `dependencies` that does; papaparse
# and pdf.js are bundled into `build/` by Vite and are pulled in as well, which
# is a few megabytes of duplication in exchange for a rule nobody has to
# hand-maintain as the updater's own dependencies change.
files:
  - package.json
  - electron/**/*
  - '!electron/**/*.spec.js'
  - build/**/*
# Releases are published to, and read from, the GitHub repository below.
#
# This is what `electron-updater` reads at run time as well: the provider block
# is written into `app-update.yml` inside the packaged app, which is how an
# installed copy knows where to look. Both halves come from here, so they cannot
# disagree about which repository an update comes from.
#
# It works unauthenticated because the repository is public. A private one would
# need a token inside the shipped app, readable by anyone holding the installer,
# which is not a trade this app makes.
publish:
  provider: github
  owner: spaceghostu
  repo: budgy

linux:
  target: AppImage
  category: Office

win:
  target: nsis
  # There is no code-signing certificate here, so the signing pass had nothing to
  # produce. Off, it is skipped; the icon and version metadata are still written
  # into the exe, which is what `signAndEditExecutable: false` would have thrown
  # away as well. What is missing is a signature, which an unsigned build was
  # never going to carry either way: Windows shows SmartScreen the first time a
  # reader runs it. Set this back when there is a certificate to name.
  #
  # Off it also keeps a Linux build from shelling out to a Windows
  # `signtool.exe` through Wine, though that alone does not make one possible —
  # NSIS builds the uninstaller by running the stub it just compiled, so a build
  # anywhere but Windows needs Wine regardless. This one was made on Windows.
  signExecutable: false

mac:
  target: dmg
  category: public.app-category.finance
